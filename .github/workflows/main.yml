name: Build Xtream Studio Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect and Apply Custom Icon if provided
        run: |
          # Clean any non-resource files from res/drawable so Gradle AAPT2 never fails
          find app/src/main/res/drawable -type f ! \( -name "*.xml" -o -name "*.png" -o -name "*.jpg" -o -name "*.webp" \) -delete
          CUSTOM_IMG=$(find . -maxdepth 1 -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) | head -n 1)
          if [ -z "$CUSTOM_IMG" ]; then
            CUSTOM_IMG=$(find app/src/main/res/drawable -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) ! -name "ic_launcher.png" | head -n 1)
          fi
          if [ -n "$CUSTOM_IMG" ]; then
            echo "Custom icon detected: $CUSTOM_IMG"
            python3 -c "
          from PIL import Image
          img = Image.open('$CUSTOM_IMG').convert('RGBA').resize((512, 512))
          img.save('app/src/main/res/drawable/ic_launcher.png', 'PNG')
          " || cp "$CUSTOM_IMG" app/src/main/res/drawable/ic_launcher.png
            rm -f app/src/main/res/drawable/ic_launcher.xml
            if [ "$(dirname "$CUSTOM_IMG")" = "app/src/main/res/drawable" ] && [ "$(basename "$CUSTOM_IMG")" != "ic_launcher.png" ]; then
              rm -f "$CUSTOM_IMG"
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XtreamStudio-IPTV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
